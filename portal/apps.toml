[apps.compute]
name = "BC-250 CU Unlock"
summary = "Tell bad CUs apart from an unstable CU unlock, and apply a tested unlock."
tag = "bc250-compute-v2.2.1"
sha256 = "c5ebfc681d7b34c03e969f3d89c06ab9408d5b9bef3a332dc2a034067b395a90"
required = false
changes_board = true
board_change = """
For the CU unlock, the app writes the GPU's shader array and WGP mask registers with umr. It does so as root, while
the driver runs. The registers are volatile. Any reboot puts the stock 24 CUs back, and nothing is burned into the
chip. The unlock stays across reboots and power offs only through the root service that CU Unlock installs. That
service is bc250-cu-unlock.service, with the masks in /etc/bc250-cu-bisect. It writes the registers again early at
every boot. Nothing is written to the BIOS, the firmware, the CMOS or the kernel's arguments. Uninstall in CU Unlock
disables the service and removes its files. The unlock then lasts until the next reboot, and after it the board is
stock. CU Unlock runs every attempt of a test in one boot by default, and writes the board's own masks back between
attempts. With Same boot off, it asks once and then restarts the board by itself after each attempt. While such a
test runs, an autostart entry opens the window again after each login. The entry goes when the test ends, is paused
or is removed with the app.
"""
category = "sustainable"
install = ["bash packaging/bazzite/install-bisect-gui.sh"]
uninstall = ["bash packaging/bazzite/uninstall-bisect-gui.sh", "bash packaging/bazzite/uninstall-gui.sh"]
detect = ["~/.local/bin/bc250-bisect-gui"]
launch = [["Open", "~/.local/bin/bc250-bisect-gui"]]

[apps.cores]
name = "BC-250 Core Unlock"
summary = "Tell bad CPU cores apart from an unstable core unlock, before you persist the 8C/16T unlock."
tag = "bc250-cores-v2.0.2"
sha256 = "0cfe5f583c8a909595ed0152356782a2ad2cb2fd9c0edc067e819de1ddd3acd5"
required = false
changes_board = true
board_change = """
The app sends the SoC's SMU one mailbox message over PCI configuration space with setpci. The message sets the core
presence mask to 0xFF in the SMU's own memory. The governor's service shares the mailbox, so the app stops it around
the message and starts it again. The mask takes effect on the next warm reboot and survives warm reboots. A full
power off reverts it to the stock 6 cores. The 8 cores stay across power offs only through the root service that
Core Unlock installs, bc250-cores-unlock.service. After a cold boot the service sends the message again and
warm-reboots once. A guard keeps it from reboot loops. Nothing is written to the BIOS, the firmware, the CMOS or the
kernel's arguments. Uninstall in Core Unlock disables the service and removes its files. The cores stay on until the
next full power off, and after it the board is stock. Core Unlock restarts the board after the core unlock, and
between its rounds when Same boot is off. It counts down 15 seconds first, and Pause stops it.
"""
category = "sustainable"
install = ["bash install.sh"]
uninstall = ["bash install.sh --uninstall"]
detect = ["~/.local/bin/bc250-cores-bisect-gui"]
launch = [["Open", "~/.local/bin/bc250-cores-bisect-gui"]]

[apps.acpi]
name = "BC-250 Persistent ACPI"
summary = "CPU C-states and frequency scaling through a persistent ACPI override (GRUB early initrd)."
tag = "bc250-acpi-v0.6.1"
sha256 = "7149e4f96c93c0e64356fe8231a759e78079a112c4bf25ffe9b6fb6bed4953a6"
required = false
changes_board = true
board_change = """
The app copies three ACPI tables to /boot/acpi_override.cpio and adds one line to /etc/default/grub. Then it
regenerates the GRUB configuration. At every boot GRUB hands the tables to the kernel. The kernel uses them in
memory instead of the BIOS's own. Both files stay across reboots, power offs and Bazzite updates. Nothing is written
to the BIOS, the firmware or the CMOS. The BIOS keeps its own tables, and the override is gone the moment the two
files are. Uninstall removes the file and the line, puts back any line that was there before, and regenerates GRUB.
After the next restart the board runs on the BIOS's tables again.
"""
category = "sustainable"
install = ["bash install.sh"]
uninstall = ["bash install.sh --uninstall"]
detect = ["~/.local/bin/bc250-persistent-acpi-gui"]
launch = [["Open", "~/.local/bin/bc250-persistent-acpi-gui"]]


[apps.quickfix]
name = "BC-250 Quickfix"
summary = "Small quickfixes for one job each. They cover Board Test's optional tools, MangoHud's config, GPU metrics, the sensors driver, the regulator's sensors, the memory map, the journal, the IOMMU and the CPU mitigations. Always installed."
tag = "bc250-quickfix-v1.11.1"
sha256 = "912e7d3c6d4a76c087de55a5078f03708aeec64507b909c15b32c5a8bc717521"
required = true
changes_board = false
category = "utilities"
install = ["bash install.sh"]
uninstall = ["bash install.sh --uninstall"]
detect = ["~/.local/bin/bc250-quickfix"]
launch = [["Open", "~/.local/bin/bc250-quickfix"]]

[[apps.quickfix.quickfixes]]
key = "tools"
name = "Quickfix"
summary = "Shows the optional tools Board Test's tests use and which of them are there. It installs the missing ones."
launch = "~/.local/bin/bc250-quickfix tools"

[[apps.quickfix.quickfixes]]
key = "mangohud"
name = "MangoHud Config"
summary = "Open or create MangoHud's config, edit and save it. Turn on the FPS log Board Test reads."
launch = "~/.local/bin/bc250-quickfix mangohud"

[[apps.quickfix.quickfixes]]
key = "metrics"
name = "Fix GPU Metrics"
summary = "Let the GPU governor write the real GPU load into gpu_metrics, for the overlays."
launch = "~/.local/bin/bc250-quickfix metrics"
changes_board = true
board_change = """
Turn on sets fix-metrics and the load method in the [gpu-usage] table of the GPU governor's settings file,
/etc/cyan-skillfish-governor-smu/config.toml. It first makes a dated backup of the file beside it. It restarts the
governor when the governor runs. The governor then mounts a patched copy of gpu_metrics over the sysfs file while it
runs. The setting stays across reboots and power offs. Nothing is written to the BIOS, the firmware or the kernel's
arguments. Turn off sets fix-metrics back to false and restarts the governor. Any earlier settings file is in its
backups.
"""

[[apps.quickfix.quickfixes]]
key = "sensors"
name = "Sensors Module"
summary = "Load a driver for the board's SuperIO chip at every boot, for its temperatures and fans."
launch = "~/.local/bin/bc250-quickfix sensors"
changes_board = true
board_change = """
Turn on writes one line to /etc/modprobe.d/bc250-quickfix-nct6683.conf. The line is options nct6683 force=true. It
also loads the nct6683 driver, which reads the temperatures and fan speeds of the board's SuperIO chip. The file
stays across reboots and power offs, so the driver loads at every boot. Nothing is written to the BIOS, the firmware
or the chip. Turn off removes the file. The driver stays loaded until the next boot.
"""

[[apps.quickfix.quickfixes]]
key = "vrm"
name = "VRM Sensors"
summary = "Build and load the module that reads the voltage, current and temperature of the CPU and GPU supply."
launch = "~/.local/bin/bc250-quickfix vrm"
changes_board = true
board_change = """
Turn on copies the source of the bc250_vrm kernel module to /var/lib/bc250-quickfix/vrm, writes the service
/etc/systemd/system/bc250-quickfix-vrm.service and starts it. The service builds the module for the running kernel and
loads it, now and at every boot, so a new kernel gets its own build. The module reads the voltage, current and
temperature of the CPU and GPU supply from the board's voltage regulator, through the SuperIO chip. When it loads it
sets up the SuperIO chip's SMBus port, which stays so until the board powers off. For every reading it writes the
regulator's page register, which selects the CPU or the GPU supply. It writes no voltage, current or limit. The folder
and the service stay across reboots and power offs. Nothing is written to the BIOS or the firmware. Turn off stops the
service, which unloads the module, and removes the service and the folder.
"""

[[apps.quickfix.quickfixes]]
key = "mapcount"
name = "Game Memory Map"
summary = "Raise vm.max_map_count, the number of memory areas a game may map."
launch = "~/.local/bin/bc250-quickfix mapcount"
changes_board = true
board_change = """
Turn on writes vm.max_map_count = 2147483642 to /etc/sysctl.d/90-bc250-quickfix-max-map-count.conf and sets it now.
The value is the number of memory areas one program may map. The file stays across reboots and power offs. Nothing
is written to the BIOS, the firmware or the kernel's arguments. Turn off removes the file and reads the system's
settings again. Then the value the other settings files give is back, or else the kernel's own.
"""

[[apps.quickfix.quickfixes]]
key = "journal"
name = "Persistent Journal"
summary = "Keep the system journal on the disk, so the logs of a boot that crashed can be read after it."
launch = "~/.local/bin/bc250-quickfix journal"
changes_board = true
board_change = """
Turn on makes the folder /var/log/journal with systemd-tmpfiles and moves the journal there. Then journald keeps the
system's logs on the disk instead of in memory only. It keeps them within its own size limits. The folder stays
across reboots and power offs. Nothing is written to the BIOS or the firmware. Turn off works only on a folder this
quickfix made. It moves the journal back to memory and removes the folder, with the logs in it.
"""

[[apps.quickfix.quickfixes]]
key = "iommu"
name = "IOMMU Off"
summary = "Keep the kernel from using the board's IOMMU, which is broken on the BC-250 (amd_iommu=off)."
launch = "~/.local/bin/bc250-quickfix iommu"
changes_board = true
board_change = """
Turn on adds the kernel argument amd_iommu=off with rpm-ostree kargs, which makes a new deployment with it. It notes
in /var/lib/bc250-quickfix/iommu.karg that the quickfix added the argument. From the next boot the kernel leaves the
AMD IOMMU unused. The argument stays across reboots, power offs and Bazzite's updates. Nothing is written to the
BIOS or the firmware. Turn off works only on an argument this quickfix added. It removes the argument with
rpm-ostree kargs, and the kernel uses the IOMMU again from the next boot. Both need a restart, which the quickfix
advises and never does.
"""

[[apps.quickfix.quickfixes]]
key = "mitigations"
name = "CPU Mitigations Off"
summary = "Turn off the kernel's CPU mitigations, which cost speed in games (mitigations=off)."
launch = "~/.local/bin/bc250-quickfix mitigations"
changes_board = true
board_change = """
Turn on adds the kernel argument mitigations=off with rpm-ostree kargs, which makes a new deployment with it. It
notes in /var/lib/bc250-quickfix/mitigations.karg that the quickfix added the argument. From the next boot the
kernel no longer guards against the CPU's speculative execution flaws, such as Spectre and Meltdown. The argument
stays across reboots, power offs and Bazzite's updates. Nothing is written to the BIOS or the firmware. Turn off
works only on an argument this quickfix added. It removes the argument with rpm-ostree kargs, and the mitigations
are back from the next boot. Both need a restart, which the quickfix advises and never does.
"""


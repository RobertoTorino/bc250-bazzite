[apps.vram]
name = "BC-250 Memory Manager"
summary = "The VRAM split in CMOS, with the GTT, TTM limit and swap layout that go with it."
tag = "bc250-vram-v5.2.1"
sha256 = "ba04095a775b1bb14ccf59c3ad003fd02e44c6f6692abaf8571b4b12f50ad06a"
required = false
changes_board = true
board_change = """
The app writes the VRAM split into the board's CMOS. It writes only the firmware's own memory block of 28 bytes in
bank 2, with its checksum, and never a byte outside it. The firmware reads the split at the next boot. The board's
battery keeps the CMOS. So the split stays across reboots and power offs until it is written again, or until the
CMOS is cleared. A fresh install of Bazzite does not reset it. Clearing the CMOS with the jumper or the battery
brings the firmware's 512 MB back. The GTT limit
is a kernel argument, set with rpm-ostree kargs in the next deployment. Nothing is written to the BIOS itself, the
firmware or the real-time clock. The app refuses to write when the block's signature or checksum does not match. It
also refuses when the kernel is locked down. Undo writes the previous split back. The Default profile writes 512 MB
and removes the kernel argument. Both take effect after a restart.
The PS5 emulator profile also writes three GPU driver options as kernel arguments, with rpm-ostree kargs. They
change the GPU driver for every program. The other profiles remove exactly these three. They take effect after a
restart. The swap layout is a few files of the app's own
in /etc. They are a zram-generator drop-in, a sysctl file, a tmpfiles line for zswap and a swap unit. The zswap
layout also makes the swap file /var/swap/swapfile. They stay across reboots and power offs. Nothing is started or
stopped before the next boot. Bazzite's own layout removes the files, and Delete swap file removes the swap file.
The memory guard is four systemd-oomd drop-ins of the app's own in /etc. They take effect at once, because
systemd-oomd restarts with them. They stay across reboots and power offs. Bazzite's own guard removes them.
Recording is a user service that writes the sessions in the app's own folder. The app turns it on and off without a
password. A learning step that needs a restart restarts the board after a countdown of 15 seconds. Until that
restart, an autostart entry of the app's own opens the window after the login. The app removes it after the restart.
While a game runs and the board stalls for memory, the recording service ends the game with SIGKILL.
"""
category = "sustainable"
install = ["bash install.sh"]
uninstall = ["bash install.sh --uninstall"]
detect = ["~/.local/bin/bc250-memory-manager"]
launch = [["Open", "~/.local/bin/bc250-memory-manager"]]

[apps.fan]
name = "BC-250 Fan Control"
summary = "The fans, and a thermal guard that warns, cools and shuts down cleanly at a critical temperature."
tag = "bc250-fan-v4.9.2"
sha256 = "6758e7d1e9b79b22b5c65ff670609e4295530c8bc0e86693dedc02d739ec117f"
required = false
changes_board = true
board_change = """
The thermal guard is a root system service that reads the temperatures every two seconds. It is
bc250-fan-control-guard.service, with its files in /etc/bc250-fan-control. At the cool limit it sets every fan to
full speed in sysfs. It also switches the GPU governor's performance mode off. At the shutdown limit, held for the
set number of seconds, it powers the board off cleanly with systemctl poweroff. The service stays enabled across
reboots and power offs. The fan settings are written in memory only. The guard puts the saved values back when it
re-arms or stops. Nothing is written to the BIOS, the firmware, the CMOS or the kernel's arguments. Turn off
disables the service and removes its files. The fans are then back on their previous setting.
If the guard switched performance mode off, performance mode stays off until you switch it on again.
"""
category = "sustainable"
install = ["bash install.sh"]
uninstall = ["bash install.sh --uninstall"]
detect = ["~/.local/bin/bc250-fan-control"]
launch = [["Open", "~/.local/bin/bc250-fan-control"]]

